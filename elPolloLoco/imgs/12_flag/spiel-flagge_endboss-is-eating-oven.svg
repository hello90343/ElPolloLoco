<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="poleGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#6b4a2f"/>
      <stop offset="1" stop-color="#4f341f"/>
    </linearGradient>
    <linearGradient id="clothGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4eedf"/>
      <stop offset="1" stop-color="#e7decd"/>
    </linearGradient>
    <style>
      .pole { fill: url(#poleGrad); }
      .metal { fill: #9aa3ad; stroke: #59616a; stroke-width: 4; }
      .cloth { fill: url(#clothGrad); stroke: #2f241c; stroke-width: 6; stroke-linejoin: round; }
      .rope { fill: none; stroke: #8a6a44; stroke-width: 10; stroke-linecap: round; }
      .txt { fill: #231a14; font-family: "Georgia", "Times New Roman", serif; font-weight: 700; letter-spacing: 1px; }
      .txtSmall { font-size: 54px; }
      .txtBig { font-size: 78px; }
    </style>
  </defs>

  <rect x="90" y="60" width="70" height="1080" rx="18" class="pole" filter="url(#softShadow)"/>
  <polygon points="125,30 160,80 90,80" class="metal" filter="url(#softShadow)"/>
  <rect x="85" y="1090" width="80" height="70" rx="14" class="metal" filter="url(#softShadow)"/>

  <path class="cloth" filter="url(#softShadow)"
        d="M 160 150
           L 830 150
           L 830 470
           C 760 485, 705 445, 640 480
           C 585 510, 520 470, 470 500
           C 415 530, 360 485, 300 515
           C 245 540, 215 520, 160 540
           Z"/>

  <path class="rope" d="M 150 185 C 170 185, 175 165, 195 165" />
  <path class="rope" d="M 150 285 C 170 285, 175 265, 195 265" />
  <path class="rope" d="M 150 385 C 170 385, 175 365, 195 365" />

  <g transform="translate(230,320)">
    <circle cx="0" cy="0" r="38" fill="#2f241c"/>
    <path d="M -30 -20 C -55 -40, -50 -70, -20 -78" fill="none" stroke="#2f241c" stroke-width="10" stroke-linecap="round"/>
    <path d="M 30 -20 C 55 -40, 50 -70, 20 -78" fill="none" stroke="#2f241c" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g transform="translate(700,315)">
    <rect x="-55" y="-45" width="110" height="90" rx="12" fill="#2f241c"/>
    <rect x="-38" y="-22" width="76" height="50" rx="8" fill="#f4eedf"/>
    <circle cx="-25" cy="-30" r="6" fill="#f4eedf"/>
    <circle cx="-5" cy="-30" r="6" fill="#f4eedf"/>
    <circle cx="15" cy="-30" r="6" fill="#f4eedf"/>
    <circle cx="35" cy="-30" r="6" fill="#f4eedf"/>
  </g>

  <text x="495" y="250" text-anchor="middle" class="txt txtBig">endboss</text>
  <text x="495" y="320" text-anchor="middle" class="txt txtSmall">is eating</text>
  <text x="495" y="410" text-anchor="middle" class="txt txtBig">oven</text>
</svg>
